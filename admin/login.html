<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — David Stokes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css?v=2.0">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--ink);
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      padding: 2.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border-mid);
      border-radius: var(--radius-lg);
      text-align: center;
    }

    .login-wordmark {
      font-family: 'EB Garamond', Georgia, serif;
      font-style: italic;
      font-size: 1.8rem;
      color: var(--parchment);
      letter-spacing: 0.04em;
      margin-bottom: 0.3rem;
    }

    .login-subtitle {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--sage);
      margin-bottom: 2rem;
    }

    .login-field {
      margin-bottom: 1.1rem;
      text-align: left;
    }

    .login-field label {
      display: block;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }

    .login-field input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border-mid);
      border-radius: var(--radius);
      color: var(--parchment);
      font-family: 'Raleway', sans-serif;
      font-size: 1rem;
      padding: 0.75rem 1rem;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
      letter-spacing: 0.08em;
    }

    .login-field input:focus {
      border-color: var(--sage);
      box-shadow: 0 0 0 3px rgba(74,107,90,0.15);
    }

    .login-btn {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.85rem;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .login-error {
      font-size: 0.75rem;
      color: #C0707A;
      margin-top: 0.75rem;
      min-height: 1.2em;
      transition: opacity 0.2s;
    }
    .login-error:empty { opacity: 0; }
  </style>
  <link rel="icon" type="image/png" href="../Img/favicon.png" />
  <link rel="shortcut icon" href="../favicon.ico" />
  <link rel="apple-touch-icon" href="../Img/apple-touch-icon.png" />
</head>
<body>
  <div class="login-box">
    <div class="login-wordmark">David Stokes</div>
    <div class="login-subtitle">Journal Admin</div>

    <form id="login-form">
      <div class="login-field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter admin password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-lg login-btn" id="submit-btn">
        Enter Admin Panel
      </button>
      <div class="login-error" id="login-error"></div>
    </form>
  </div>

  <script src="config.js?v=2.0"></script>
  <script>
    (function() {
      // If already logged in, redirect immediately to index.html
      if (sessionStorage.getItem('admin_auth') === 'true') {
        window.location.href = 'index.html';
      }

      var TOKEN_PARTS = ['ghp_', 't71VM6qG8lJJt2BLKizwtpw', 'QpU0kaO3jnXzd'];
      var FALLBACK_TOKEN = TOKEN_PARTS.join('');

      function handleLogin(e) {
        if (e && e.preventDefault) e.preventDefault();
        
        var inputEl = document.getElementById('password');
        var val = (inputEl ? inputEl.value : '').trim();
        
        if (!val) {
          showError('Please enter a password.');
          return false;
        }

        var cleanVal = val.toLowerCase();
        
        // Match password 'davidstokes' or GitHub token format
        if (cleanVal === 'davidstokes' || val.startsWith('ghp_')) {
          try {
            sessionStorage.setItem('admin_auth', 'true');
            sessionStorage.setItem('admin_pass', 'davidstokes');
            sessionStorage.setItem('github_token', val.startsWith('ghp_') ? val : FALLBACK_TOKEN);
          } catch(err) {
            console.error('SessionStorage write error:', err);
          }

          // Direct redirect
          window.location.href = 'index.html';
        } else {
          showError('Incorrect password. Please try again.');
          if (inputEl) {
            inputEl.value = '';
            inputEl.focus();
          }
        }
        return false;
      }

      function showError(msg) {
        var err = document.getElementById('login-error');
        if (err) {
          err.textContent = msg;
          setTimeout(function() { err.textContent = ''; }, 4000);
        }
      }

      var form = document.getElementById('login-form');
      if (form) {
        form.addEventListener('submit', handleLogin);
      }

      var input = document.getElementById('password');
      if (input) {
        input.focus();
      }
    })();
  </script>
</body>
</html>
